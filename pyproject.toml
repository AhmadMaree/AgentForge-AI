[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "A modular AI agent framework built from scratch"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
search = ["tavily-python"]
dev = ["pytest", "pytest-asyncio", "ruff"]
memory = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "neo4j>=5.0",
]

rl = [
    "torch>=2.2",
    "transformers>=4.45",
    "trl>=0.12",
    "peft>=0.13",
    "datasets>=3.0",
]

rag =[
    "pypdf>=5.0",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["agentforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

